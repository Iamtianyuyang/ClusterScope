version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clusterscope
      POSTGRES_USER: clusterscope
      POSTGRES_PASSWORD: clusterscope
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clusterscope"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      # The server reads these env vars (POSTGRES_URL / JWT_SECRET / ...)
      POSTGRES_URL: postgresql://clusterscope:clusterscope@postgres:5432/clusterscope
      JWT_SECRET: clusterscope-secret-change-me
      AUTH_REQUIRED: "false"
      # Shared secret for agent <-> server gRPC. Change it and set the same
      # value in every agent's agent.yaml (or `--agent-token`).
      AGENT_TOKEN: change-me-too-agent-token
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
