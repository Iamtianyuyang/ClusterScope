<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="128" height="128">
  <!-- background -->
  <rect width="64" height="64" rx="13" fill="#0f1419"/>
  <rect x="1" y="1" width="62" height="62" rx="12" fill="none" stroke="#2aa198" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- pulse line (monitoring) -->
