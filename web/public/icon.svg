<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256">
  <defs>
    <!-- subtle inner glow for the active GPU -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="64" height="64" rx="14" fill="#0d1117"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#2aa198" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- monitoring pulse in the C-opening (top-right) -->
  <path d="M40 10.5 q 2.5 -3.5 5 0 t 5 0" fill="none" stroke="#2aa198" stroke-width="1.8"
        stroke-linecap="round" opacity="0.9"/>

  <!-- GPU grid: 3x3 with top-right cell removed -> "C" shape -->
  <!-- row 0 -->
  <rect x="8"  y="14" width="12" height="12" rx="3" fill="#15202b" stroke="#2aa198" stroke-width="1.5"/>
  <rect x="23" y="14" width="12" height="12" rx="3" fill="#15202b" stroke="#2aa198" stroke-width="1.5"/>
  <!-- row 1 (active GPU highlighted, yellow) -->
  <rect x="8"  y="29" width="12" height="12" rx="3" fill="#15202b" stroke="#2aa198" stroke-width="1.5"/>
  <rect x="23" y="29" width="12" height="12" rx="3" fill="#15202b" stroke="#2aa198" stroke-width="1.5"/>
  <rect x="38" y="29" width="12" height="12" rx="3" fill="#ffd166" stroke="#ffd166" stroke-width="1.5"/>
  <circle cx="44" cy="35" r="7" fill="url(#glow)"/>
  <!-- row 2 -->
  <rect x="8"  y="44" width="12" height="12" rx="3" fill="#15202b" stroke="#2aa198" stroke-width="1.5"/>
  <rect x="23" y="44" width="12" height="12" rx="3" fill="#15202b" stroke="#2aa198" stroke-width="1.5"/>
  <rect x="38" y="44" width="12" height="12" rx="3" fill="#15202b" stroke="#2aa198" stroke-width="1.5"/>
</svg>
