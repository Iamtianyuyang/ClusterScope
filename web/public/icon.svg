    <!-- row 1 -->
    <rect x="9"  y="30" width="13" height="13" rx="3" fill="#15202b" stroke="#2aa198" stroke-width="1.5"/>
    <rect x="25" y="30" width="13" height="13" rx="3" fill="#15202b" stroke="#2aa198" stroke-width="1.5"/>
    <rect x="41" y="30" width="13" height="13" rx="3" fill="#ffd166" stroke="#ffd166" stroke-width="1.5"/>
    <!-- row 2 -->
    <rect x="9"  y="46" width="13" height="13" rx="3" fill="#15202b" stroke="#2aa198" stroke-width="1.5"/>
    <rect x="25" y="46" width="13" height="13" rx="3" fill="#15202b" stroke="#2aa198" stroke-width="1.5"/>
    <rect x="41" y="46" width="13" height="13" rx="3" fill="#15202b" stroke="#2aa198" stroke-width="1.5"/>
  </g>
</svg>
