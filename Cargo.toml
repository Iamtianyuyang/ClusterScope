[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/protocol",
    "crates/storage",
    "crates/agent",
    "crates/server",
    "crates/scheduler",
    "crates/tui",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
authors = ["ClusterScope Team"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
tonic-build = "0.12"
prost = "0.13"
prost-types = "0.13"
axum = { version = "0.8", features = ["ws", "macros", "form"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
argon2 = { version = "0.5", features = ["std"] }
jsonwebtoken = "9"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "runtime-tokio"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
prometheus-client = "0.22"
parking_lot = "0.12"
lru = "0.14"

common = { path = "crates/common" }
protocol = { path = "crates/protocol" }
storage = { path = "crates/storage" }
