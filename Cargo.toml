[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/protocol",
    "crates/storage",
    "crates/agent",
    "crates/server",
    "crates/scheduler",
    "crates/tui",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
authors = ["ClusterScope Team"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
tonic-build = "0.12"
prost = "0.13"
prost-types = "0.13"
axum = { version = "0.8", features = ["ws", "macros", "form"] }
hyper = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
serde_yaml = "0.9"
serde-reflection = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
futures = "0.3"
rand = "0.9"
sha2 = "0.10"
argon2 = { version = "0.5", features = ["std"] }
jsonwebtoken = "9"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "runtime-tokio"] }
redis = { version = "0.27", features = ["tokio", "tokio-comp", "connection-manager"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio-util = "0.7"
bytes = "1"
home = "0.5"
config = "0.14"
clap = { version = "4", features = ["derive"] }
colored = "3"
dirs = "6"
fs4 = "0.13"
globset = "0.4"
notify = "8"
once_cell = "1"
regex = "1"
itertools = "0.14"
prometheus-client = "0.22"
rcgen = "0.13"
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"
rustls-pki-types = "1"
parking_lot = "0.12"
dashmap = "6"
lru = "0.14"
indexmap = "2"

common = { path = "crates/common" }
protocol = { path = "crates/protocol" }
storage = { path = "crates/storage" }
